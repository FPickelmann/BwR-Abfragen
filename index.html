/* NIVO assessment */
:root{--ink:#172a37;--green:#116151;--navy:#173e50;--line:#d2dfe4;--soft:#eaf5f7;background:#eef3f5}
header{background:#132f3e;color:#fff;min-height:86px;border-bottom:4px solid #337d72}
.brand{display:flex;align-items:center;gap:16px;min-width:0}.brand img{width:108px;border-radius:14px;background:#fff;padding:8px}.brand b,.brand small{display:block}.brand small{color:#d0e0e7}
main{max-width:1000px;padding-top:clamp(18px,4vw,44px)}.panel{border-radius:24px;padding:clamp(18px,4.8vw,48px);box-shadow:0 6px 26px #173e5009;margin-bottom:22px}
.welcome h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.045em}.welcome .einzel{max-width:66ch;font-size:1.12rem;margin-top:18px}.welcome .felder{grid-template-columns:2fr 1fr;margin:25px 0 19px}.tipps{display:grid;gap:8px;margin:0 0 24px;padding-left:20px;color:#445968}
.task-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.nr{border-radius:11px;display:inline-grid;place-items:center;min-width:40px;min-height:40px;padding:0 6px;background:#214657;color:#fff;font-weight:750}.task-title{color:#546775;font-size:.94rem;font-weight:650}.task-meta .points{margin-left:auto;color:#546775}.typ{padding:4px 10px;border-radius:999px;font-weight:750;font-size:.76rem;letter-spacing:.045em}.rechnen{background:#d9f1ec;color:#075548}.theorie{background:#eee6f8;color:#603588}.buchung{background:#fbe9d3;color:#783f14}
.task-question{font-size:clamp(1.45rem,3.4vw,2.1rem);line-height:1.23;margin:20px 0}.vorgabe{border:1px solid #bcdae2;padding:clamp(12px,2.8vw,22px);line-height:1.6;margin:16px 0}.vorgabe small{display:block;color:#225d70;font-weight:750;letter-spacing:.04em;margin-bottom:5px}.felder{gap:14px;margin-block:18px}.kasten{border:1px solid #cbdfe3;background:#f1f7f8}.calculator{display:flex;align-items:center;gap:11px;margin:16px 0;font-weight:650;color:#3f5865}.calculator img{width:54px;height:54px;object-fit:contain;border-radius:10px;mix-blend-mode:multiply}
input,select,textarea,button,.button-link{min-height:48px;border-radius:11px}.einheit{position:relative}.einheit b{position:absolute;right:10px;color:#60747d}.einheit input{padding-right:28px}.buchungszeile input,.buchungszeile select{height:48px}.buchungszeile{gap:8px}.buchungszeile label>span{min-height:1.4em}.button-link{display:inline-flex;align-items:center;border:1px solid var(--line);padding:8px 12px;font-weight:650;background:#fff;color:#20586a;text-underline-offset:3px}.buchungs-tools{display:flex;flex-wrap:wrap;gap:10px;margin-block:18px}.aktionen{padding-top:18px;border-top:1px solid #e6edf0;margin-top:24px}
.ja-nein{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.antwort-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px;margin-top:10px}.antwort-grid button{padding:10px 7px;overflow-wrap:anywhere;min-height:58px}.antwort-grid button:not([aria-pressed=true]){background:#fff}
.oral-mode{text-align:center;border:1px solid var(--line);border-radius:14px;background:#f3f6f8;color:#445b68;padding:18px;margin:18px 0;font-weight:650}.oral{background:#fff6df;border:1px solid #e8c572;padding:clamp(12px,3vw,24px);color:#693d10}.oral .ja-nein{border:0;border-bottom:1px solid #ead9ad;border-radius:0;padding:11px 0}.oral button{min-width:63px;border-color:#ddbb69}.oral button[aria-pressed=true]{background:#73440f;border-color:#73440f}.oral-total{font-weight:750;margin-top:10px}
.hinweis{border:1px solid #e7c575;background:#fff6df;border-radius:14px;padding:15px;margin-top:18px;color:#693d10}.hinweis:focus{outline:2px solid #a56723;outline-offset:2px}.hinweis p{margin-bottom:10px}
.result-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.result-karten{display:flex;gap:9px}.result-karten div{padding:12px 18px;border-radius:14px;background:#eaf4f6;text-align:center}.result-karten .note{background:#116151;color:#fff}.result-karten strong{display:block;font-size:1.85rem}.result-list{margin-top:12px}.result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:7px;border-bottom:1px solid var(--line);padding:11px 0}.result-row summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none}.result-row summary::before{content:'›';font-size:1.35rem}.result-row details[open] summary::before{transform:rotate(90deg)}.result-row .nr{min-height:32px;min-width:32px}.punkte-tools{display:flex;align-items:center;gap:6px}.punkte-tools button{min-height:38px;padding:4px 11px}.noten{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}.noten span{text-align:center;border:1px solid var(--line);background:#fff}.noten span strong{display:block;font-size:1.25rem}.noten span[aria-current=true]{background:#ddf1ec;border-color:#34836e}.no-print textarea{margin-top:7px}
@media(max-width:530px){.brand img{width:72px}.brand small{font-size:.72rem}.brand{gap:8px}.welcome .felder{grid-template-columns:1fr}.task-meta .points{margin-left:0}.result-row{grid-template-columns:minmax(0,1fr)}.punkte-tools{justify-self:end}}
@media print{.panel{box-shadow:none}.result-row{display:block;break-inside:avoid}.result-karten{print-color-adjust:exact}.result-row summary::before{display:none}.noten{grid-template-columns:repeat(6,1fr)}}
/* Fields, task colours and selection states */
:root{font-family:"Avenir Next",system-ui,sans-serif}
input::placeholder,textarea::placeholder{color:#667780;opacity:1}
select:has(option:checked[value=""]){color:#667780}
select option{color:var(--ink)}
.task.rechnen,.task.buchung,.task.theorie{background:#fff;color:var(--ink)}
.task.rechnen{--task-bg:#d9f1ec;--task-ink:#075548}
.task.buchung{--task-bg:#fbe9d3;--task-ink:#783f14}
.task.theorie{--task-bg:#eee6f8;--task-ink:#603588}
.task .task-question{padding:clamp(12px,2.4vw,22px);border-radius:13px;background:var(--task-bg);color:var(--task-ink)}
.task .kasten{background:#f5f1e8;border-color:#e1d8c5}
.satz fieldset.soll{background:#edf7f0;border-color:#bedac9}
.satz fieldset.haben{background:#fcf0ef;border-color:#e5c4c4}
.satz .soll legend{color:#19613d}
.satz .haben legend{color:#912f37}
.task .theorie-antworten{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:148px}
.theorie-antworten button[aria-pressed=true][data-v="1"]{background:#17633e;border-color:#17633e}
.theorie-antworten button[aria-pressed=true][data-v="0"]{background:#96303a;border-color:#96303a}
.oral-mode{display:flex;justify-content:center;align-items:center;gap:12px}
.oral-mode svg{width:25px;height:25px;flex:none}

function cent(v){
 const s=String(v??"").trim().replace(/\s*€$/,"");
 if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(s))return null;
 const [x,y=""]=s.replaceAll(".","").split(",");
 const n=100*Number(x)+Number(y.padEnd(2,"0"));
 return Number.isSafeInteger(n)?n:null;
}
function anteil(v){
 const s=String(v??"").trim().replace(/\s*%$/,"");
 if(!/^\d{1,3}(?:,\d{1,4})?$/.test(s))return null;
 const n=Number(s.replace(",","."));
 return n<=100?n:null;
}

 }).join("")+'</div></section><section class="panel"><h2>Notenschlüssel</h2><div class="noten">'+grenzen.map((g,i)=>'<span aria-current="'+(note===i+1)+'"><strong>'+ (i+1)+'</strong>'+punkt.format(g)+(i===0?'–15':'–'+punkt.format(grenzen[i-1]-.5))+' P.</span>').join("")+'</div></section>'+
 '<section class="panel"><h2>Dokumentation</h2><p class="klein einzel">Die PDF enthält Antworten, Lösungen, Punkte, Korrekturen und den Notenschlüssel.</p><label class="no-print einzel"><span>Bemerkungen der Lehrkraft</span><textarea id="bem" placeholder="Optionale Bemerkung">'+esc(bem)+'</textarea></label><div class="aktionen"><button data-act="neu">Neue Abfrage starten</button><button class="primary weiter" data-act="pdf">Dokumentation als PDF herunterladen</button></div></section>');
 if(offen>=0){app.querySelector('.punkte-tools [data-i="'+offen+'"]:not([disabled])')?.focus({preventScroll:true});}

}
// A compact, text-selectable PDF using the standard PDF fonts.
function erstellePdf(eintraege){
 const seiten=[];
 let zeilen=[], y=781;
 const satzzeichen="€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
 const windowsCodes=[128,130,131,132,133,134,135,136,137,138,139,140,142,145,146,147,148,149,150,151,152,153,154,155,156,158,159];
 const canvas=document.createElement("canvas").getContext("2d");
 const pdfText=text=>Array.from(text.normalize("NFC")).map(char=>{
  const code=char.codePointAt(0);
  const index=satzzeichen.indexOf(char);
  const byte=index>=0?windowsCodes[index]:code>=32&&code<=255?code:63;
  return byte.toString(16).padStart(2,"0");
 }).join("");
 function flush(){
  const page=seiten.length+1;
  seiten.push(zeilen.concat("BT /F1 9 Tf 0.35 0.42 0.45 rg 44 32 Td <"+pdfText("NIVO · Seite "+page)+"> Tj ET").join("\n"));
  zeilen=[];y=781;
 }
 function umbrechen(text,gross,fett){
  canvas.font=(fett?"bold ":"")+gross+"px Arial";
  const lines=[];
  for(const block of String(text).split(/\r?\n/)){
   let line="";
   for(const word of block.split(/\s+/)){
    const joined=line?line+" "+word:word;
    if(canvas.measureText(joined).width<=489){line=joined;continue;}
    if(line)lines.push(line);
    line="";
    for(const char of word){
     if(canvas.measureText(line+char).width>489){lines.push(line);line="";}
     line+=char;
    }
   }
   lines.push(line);
  }
  return lines;
 }
 for(const {text,gross=11,fett=false,abstand=0} of eintraege){
  const lines=umbrechen(text,gross,fett);
  if(y<65+abstand+gross*(Math.min(lines.length,3)+1))flush();
  y-=abstand;
  for(const line of lines){
   if(y<59)flush();
   zeilen.push("BT /"+(fett?"F2":"F1")+" "+gross+" Tf 0.07 0.17 0.22 rg 44 "+y+" Td <"+pdfText(line)+"> Tj ET");
   y-=gross+5;
  }
 }
 if(zeilen.length)flush();
 const objects=["<< /Type /Catalog /Pages 2 0 R >>",
  "<< /Type /Pages /Kids ["+seiten.map((_,i)=>(5+i*2)+" 0 R").join(" ")+"] /Count "+seiten.length+" >>",
  "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
  "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
 seiten.forEach((stream,i)=>{
  objects.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+i*2)+" 0 R >>");
  objects.push("<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream");
 });
 let file="%PDF-1.4\n";
 const offsets=objects.map((object,i)=>{
  const offset=file.length;
  file+=(i+1)+" 0 obj\n"+object+"\nendobj\n";
  return offset;
 });
 const xref=file.length;
 file+="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n"+offsets.map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("");
 return file+"trailer\n<< /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n";
}
function dokumentation(){
 const werte=bewerten();
 const erzielt=werte.map((r,i)=>adjust[i]??werteSum(r));
 const summe=erzielt.reduce((sum,p)=>sum+p,0);
 const note=grenzen.findIndex(g=>summe>=g)+1;
 const datum=new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",dateStyle:"short"}).format(ende);
 const zeilen=[
  {text:"NIVO · Mündliche BwR-Abfrage",fett:true},
  {text:"Immobilienkauf und GWG",gross:21,fett:true,abstand:6},
  {text:name+" · Klasse "+klasse+" · "+datum,abstand:10},
  {text:"Beginn "+uhrzeit.format(start)+" · Ende "+uhrzeit.format(ende)+" · "+uhr.textContent},
  {text:punkt.format(summe)+" / 15 Punkte · Note "+note,fett:true,gross:15,abstand:8}
 ];
 werte.forEach((items,i)=>{
  const auto=werteSum(items);
  const status=auto!==erzielt[i]?" (automatisch "+punkt.format(auto)+" P.)":"";
  zeilen.push({text:"Aufgabe "+nummer[i]+" · "+titel[i]+" · "+punkt.format(erzielt[i])+" / "+punkt.format(max[i])+" P."+status,fett:true,gross:13,abstand:12});
  items.forEach(r=>zeilen.push(
   {text:r.label+" · "+punkt.format(r.p)+" / "+punkt.format(r.max)+" P.",fett:true,abstand:4},
   {text:"Antwort: "+r.ist},
   {text:"Erwartet: "+r.soll},
   ...(r.hinweis?[{text:r.hinweis,gross:10}]:[])
  ));
 });
 zeilen.push({text:"Notenschlüssel",gross:13,fett:true,abstand:12});
 grenzen.forEach((g,i)=>zeilen.push({text:"Note "+(i+1)+" · "+punkt.format(g)+"–"+(i===0?"15":punkt.format(grenzen[i-1]-.5))+" P."}));
 zeilen.push({text:"Bemerkungen der Lehrkraft",gross:13,fett:true,abstand:12},{text:bem||"—"});
 return erstellePdf(zeilen);
}
function pdfSpeichern(){
 const file=new Blob([dokumentation()],{type:"application/pdf"});
 const url=URL.createObjectURL(file);
 const link=document.createElement("a");
 const datum=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Berlin"}).format(ende);
 link.href=url;
 link.download="NIVO_BwR_Immobilienkauf_GWG_"+datum+".pdf";
 document.body.append(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
